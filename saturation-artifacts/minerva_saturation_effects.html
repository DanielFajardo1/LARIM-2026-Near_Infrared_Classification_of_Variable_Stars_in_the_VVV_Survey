                    const layout = {
                        title: { text: `ID: ${star.id} | P = ${star.Period.toFixed(4)} d`, font: {color: colors.font, size: 14} },
                        paper_bgcolor: colors.paper, plot_bgcolor: colors.plot,
                        xaxis: { title: 'Phase', color: colors.font, gridcolor: colors.grid, fixedrange: true },
                        yaxis: { title: 'Ks-band', color: colors.font, gridcolor: colors.grid, autorange: 'reversed', fixedrange: true },
                        showlegend: false,
                        margin: { l: 45, r: 15, t: 40, b: 40 }
                    };
                    
                    Plotly.react('plot-' + index, [trace1, trace2], layout, {responsive: true, displayModeBar: false});
                });
            }
            
            btnTheme.addEventListener('click', () => {
                isDark = !isDark;
                document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                btnTheme.innerHTML = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
                renderAllCharts();
            });
            
            renderAllCharts();
        </script>
    </body>
    </html>
