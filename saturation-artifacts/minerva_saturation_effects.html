            let isDark = true;
            
            const btnTheme = document.getElementById('btnTheme');
            const container = document.getElementById('charts-container');
            
            function getColors() {
                return {
                    font: isDark ? '#ffffff' : '#000000',
                    grid: isDark ? '#333333' : '#dddddd',
                    paper: 'rgba(0,0,0,0)',
                    plot: 'rgba(0,0,0,0)'
                };
            }
            
            // Construir los contenedores div
            starData.forEach((star, index) => {
                const div = document.createElement('div');
                div.id = 'plot-' + index;
                div.className = 'chart-box';
                container.appendChild(div);
            });
            
            function renderAllCharts() {
                const colors = getColors();
                
                starData.forEach((star, index) => {
                    const validMags = star.mag.filter(m => m !== null);
                    if (validMags.length === 0) return;
                    
                    const minMagIdx = star.mag.indexOf(Math.min(...validMags));
                    const hjd0 = star.mjd[minMagIdx];
                    
                    let phase1 = [], mag1 = [], phase2 = [], mag2 = [];
                    
                    star.mjd.forEach((hjd, i) => {
                        if(hjd !== null && star.mag[i] !== null) {
                            let p = ((hjd - hjd0) / star.Period) % 1;
                            p = p < 0 ? p + 1 : p;
                            
                            phase1.push(p);
                            mag1.push(star.mag[i]);
                            phase2.push(p + 1.0);
                            mag2.push(star.mag[i]);
                        }
                    });
                    
                    const trace1 = { x: phase1, y: mag1, mode: 'markers', type: 'scatter', marker: {color: '#ff3333', size: 5, opacity: 0.75} };
                    const trace2 = { x: phase2, y: mag2, mode: 'markers', type: 'scatter', marker: {color: '#ff3333', size: 5, opacity: 0.75} };
                    
                    const layout = {
                        title: { text: `ID: ${star.id} | P = ${star.Period.toFixed(4)} d`, font: {color: colors.font, size: 14} },
                        paper_bgcolor: colors.paper, plot_bgcolor: colors.plot,
                        xaxis: { title: 'Phase', color: colors.font, gridcolor: colors.grid, fixedrange: true },
                        yaxis: { title: 'Ks-band', color: colors.font, gridcolor: colors.grid, autorange: 'reversed', fixedrange: true },
                        showlegend: false,
                        margin: { l: 45, r: 15, t: 40, b: 40 }
                    };
                    
                    Plotly.react('plot-' + index, [trace1, trace2], layout, {responsive: true, displayModeBar: false});
                });
            }
            
            btnTheme.addEventListener('click', () => {
                isDark = !isDark;
                document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                btnTheme.innerHTML = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
                renderAllCharts();
            });
            
            renderAllCharts();
        </script>
