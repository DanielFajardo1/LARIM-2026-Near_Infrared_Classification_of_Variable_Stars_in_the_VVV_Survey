
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MINERVA: Parameter Explorer</title>
        <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
        <style>
            :root {
                --bg-body: #0b0c10;
                --bg-panel: #121212;
                --text-main: #ffffff;
                --text-muted: #aaaaaa;
                --border-color: #333333;
                --input-bg: #1f2833;
            }
            [data-theme="light"] {
                --bg-body: #f4f4f9;
                --bg-panel: #ffffff;
                --text-main: #111111;
                --text-muted: #555555;
                --border-color: #cccccc;
                --input-bg: #eeeeee;
            }
            body { background-color: var(--bg-body); color: var(--text-main); font-family: Arial, sans-serif; margin: 0; padding: 15px; transition: all 0.3s; }
            h2 { text-align: center; margin-bottom: 5px; }
            p { text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
            
            .main-container { display: flex; flex-direction: column; gap: 15px; max-width: 1300px; margin: 0 auto; }
            
            .controls-top { display: flex; justify-content: center; align-items: center; gap: 15px; background: var(--bg-panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; transition: all 0.3s;}
            select, button { padding: 8px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; transition: all 0.3s; font-weight: bold;}
            button:hover { opacity: 0.8; }
            
            .middle-section { display: flex; gap: 15px; height: 55vh; }
            .sidebar { flex: 0 0 200px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; transition: all 0.3s;}
            .sidebar h4 { margin: 0 0 10px 0; color: #00b4d8; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;}
            .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
            .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px;}
            
            .scatter-container { flex: 1; background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; transition: all 0.3s;}
            
            .bottom-section { display: flex; gap: 15px; height: 40vh; }
            .lc-container { flex: 2; background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; transition: all 0.3s;}
            .table-container { flex: 1; background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; overflow-y: auto; transition: all 0.3s;}
            
            table { width: 100%; border-collapse: collapse; font-size: 13px; }
            th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--border-color); }
            th { color: var(--text-muted); }
            
            @media (max-width: 900px) {
                .middle-section { flex-direction: column; height: auto; }
                .scatter-container { height: 50vh; width: 100%; }
                .sidebar { flex: none; flex-direction: row; flex-wrap: wrap; }
                .bottom-section { flex-direction: column; height: auto; }
                .lc-container { height: 45vh; width: 100%; }
            }
            
            @media (max-width: 600px) {
                .controls-top { flex-direction: column; align-items: stretch; }
                .scatter-container { height: 40vh; }
                .lc-container { height: 40vh; }
                .sidebar { justify-content: center; }
            }
        </style>
    </head>
    <body data-theme="dark">
        <h2>MINERVA Catalog: Parameter Space</h2>
        <p>Use the dropdowns to set axes and filter groups. Toggle individual classes on the left. <b>Click any star</b> to view its light curve.</p>
        
        <div class="main-container">
            <div class="controls-top">
                <button id="btnTheme">☀️ Light Mode</button>
                <label>Category: 
                    <select id="macroSelect">
                        <option value="all">All Stars</option>
                        <option value="pulsators">Radial Pulsators (CEP-F, RRab, RRc)</option>
                        <option value="eclipsing">Eclipsing Binaries (EA, EB, EW)</option>
                    </select>
                </label>
                <label>X-Axis: <select id="xSelect"></select></label>
                <label>Y-Axis: <select id="ySelect"></select></label>
            </div>
            
            <div class="middle-section">
                <div class="sidebar">
                    <h4>Filter Classes</h4>
                    <div class="checkbox-group" id="checkboxContainer"></div>
                </div>
                <div id="scatterPlot" class="scatter-container"></div>
            </div>
            
            <div class="bottom-section">

                <div class="table-container">

                        <tbody id="tableBody">
                            <tr><td>Select a star in the plot...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

                return {
                    font: isDark ? '#ffffff' : '#000000',
                    grid: isDark ? '#333333' : '#dddddd',
                    paper: 'rgba(0,0,0,0)',
                    plot: 'rgba(0,0,0,0)'
                };
            }
            
            metrics.forEach(m => {
                xSelect.add(new Option(m, m));
                ySelect.add(new Option(m, m));
            });
            xSelect.value = 'Period';
            ySelect.value = 'Eclipse_Depth_Ratio';
            
            allClasses.forEach(c => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';
                label.innerHTML = `<input type="checkbox" value="${c}" checked> <span style="color:${colorMap[c]}; font-weight:bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">${c}</span>`;
                checkboxContainer.appendChild(label);
            });
            const checkboxes = Array.from(document.querySelectorAll('.checkbox-group input'));
            
            function getActiveClasses() {
                return checkboxes.filter(cb => cb.checked).map(cb => cb.value);
            }
            
            macroSelect.addEventListener('change', () => {
                const val = macroSelect.value;
                checkboxes.forEach(cb => {
                    if (val === 'all') cb.checked = true;
                    else if (val === 'pulsators') cb.checked = ['CEP-F', 'RRab', 'RRc'].includes(cb.value);
                    else if (val === 'eclipsing') cb.checked = ['EA', 'EB', 'EW'].includes(cb.value);
                });
                drawScatter();
            });
            
            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    macroSelect.value = 'all';
                    drawScatter();
                });
            });
            
            xSelect.addEventListener('change', drawScatter);
            ySelect.addEventListener('change', drawScatter);
            
            function drawScatter() {
                const xMet = xSelect.value;
                const yMet = ySelect.value;
                const active = getActiveClasses();
                const colors = getColors();
                
                const traces = active.map(c => {
                    const filtered = starData.filter(s => s.clase === c && s[xMet] !== null && s[yMet] !== null);
                    return {
                        x: filtered.map(s => s[xMet]),
                        y: filtered.map(s => s[yMet]),
                        mode: 'markers',
                        type: 'scatter',
                        name: c,
                        marker: { color: colorMap[c] || 'white', size: 9, opacity: 0.85, line: {width: 1, color: isDark ? '#111' : '#fff'} },
                        customdata: filtered,
                        hovertemplate: `<b>${c}</b><br>${xMet}: %{x:.4f}<br>${yMet}: %{y:.4f}<extra></extra>`
                    };
                });
                
                const layout = {
                    paper_bgcolor: colors.paper, plot_bgcolor: colors.plot,
                    xaxis: { title: xMet, type: 'linear', color: colors.font, gridcolor: colors.grid, fixedrange: true, autorange: true },
                    yaxis: { title: yMet, type: 'linear', color: colors.font, gridcolor: colors.grid, fixedrange: true, autorange: true },
                    legend: { font: {color: colors.font}, bgcolor: colors.paper },
                    margin: { l: 60, r: 20, t: 30, b: 50 },
                    hovermode: 'closest'
                };
                
                Plotly.react('scatterPlot', traces, layout, {responsive: true, displayModeBar: false});
            }
            
            function inspectStar(star) {
                currentStar = star;
                const colors = getColors();
                
                // Alineación de fase emulando (HJD - HJD_0) / periodo % 1 garantizando el rango [0, 1)
                const minMagIdx = star.mag.indexOf(Math.min(...star.mag));
                const hjd0 = star.mjd[minMagIdx];
                
                const phase = star.mjd.map(hjd => {
                    let p = ((hjd - hjd0) / star.Period) % 1;
                    return p < 0 ? p + 1 : p;
                });
                const phase2 = phase.map(v => v + 1.0);
                
                const trace1 = { x: phase, y: star.mag, mode: 'markers', type: 'scatter', marker: {color: colorMap[star.clase], size: 5, opacity: 0.8} };
                const trace2 = { x: phase2, y: star.mag, mode: 'markers', type: 'scatter', marker: {color: colorMap[star.clase], size: 5, opacity: 0.8} };
                
                const layoutLC = {
                    title: { text: `Folded Light Curve`, font: {color: colors.font, size: 14} },
                    paper_bgcolor: colors.paper, plot_bgcolor: colors.plot,
                    xaxis: { title: 'Phase', color: colors.font, gridcolor: colors.grid, fixedrange: true },
                    yaxis: { title: 'Ks-band', color: colors.font, gridcolor: colors.grid, autorange: 'reversed', fixedrange: true },
                    showlegend: false,
                    margin: { l: 50, r: 20, t: 40, b: 40 }
                };
                Plotly.react('lcPlot', [trace1, trace2], layoutLC, {responsive: true, displayModeBar: false});
                
                document.getElementById('tableTitle').innerHTML = `ID: ${star.id} <br><span style="color:${colorMap[star.clase]}; font-size:14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Class: ${star.clase}</span>`;
                let tbody = '';
                metrics.forEach(m => {
                    const unit = unitsMap[m] || '';
                    const val = star[m] !== null ? star[m].toFixed(5) + unit : 'N/A';
                    tbody += `<tr><th>${m}</th><td style="color:var(--text-main); font-weight:bold;">${val}</td></tr>`;
                });
                document.getElementById('tableBody').innerHTML = tbody;
            }
            
            drawScatter();
            if (starData.length > 0) inspectStar(starData[0]);
            
            document.getElementById('scatterPlot').on('plotly_click', function(data) {
                if(data.points.length > 0) inspectStar(data.points[0].customdata);
            });
        </script>
    </body>
    </html>
