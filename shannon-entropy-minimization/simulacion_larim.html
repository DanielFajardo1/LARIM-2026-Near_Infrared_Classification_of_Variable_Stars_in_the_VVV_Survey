            let currentStarIdx = 0;
            let isDark = false;
            let isPlaying = false;
            let playInterval;
            let currentPIdx = 0;
            
            const selectStar = document.getElementById('starSelect');
            const slider = document.getElementById('pSlider');
            const pValDisplay = document.getElementById('pValDisplay');
            const btnPlay = document.getElementById('btnPlay');
            const btnTrueP = document.getElementById('btnTrueP');
            const btnTheme = document.getElementById('btnTheme');
            
            // Llenar el menú desplegable agrupado por Clases (optgroup)
            const clasesUnicas = [...new Set(starData.map(s => s.clase))];
            
            clasesUnicas.forEach(clase => {
                let grupo = document.createElement('optgroup');
                grupo.label = clase;
                
                starData.forEach((star, i) => {
                    if (star.clase === clase) {
                        let opt = document.createElement('option');
                        opt.value = i;
                        opt.innerHTML = `ID: ${star.id}`; // Muestra solo el ID bajo el nombre de la clase
                        grupo.appendChild(opt);
                    }
                });
                
                selectStar.appendChild(grupo);
            });
            
            function calcPhase(mjd, mjd0, p) { return mjd.map(t => ((t - mjd0) / p) % 1); }
            
            function getLayouts(star, p_actual) {
                const fontColor = isDark ? '#ffffff' : '#000000';
                const bgColor = isDark ? '#0b0c10' : '#ffffff';
                const gridColor = isDark ? '#2a2a2a' : '#e5e5e5';
                
                const layoutEntropy = {
                    title: {text: 'Periodogram', font: {size: 18, color: fontColor}},
                    paper_bgcolor: bgColor, plot_bgcolor: bgColor,
                    xaxis: {title: 'Trial Period (days)', gridcolor: gridColor, color: fontColor, tickformat: '.4f'},
                    yaxis: {title: 'Entropy', gridcolor: gridColor, color: fontColor},
                    margin: {l: 60, r: 20, t: 50, b: 50},
                    showlegend: true, legend: {font: {color: fontColor, size: 14}}
                };
                
                const layoutLC = {
                    title: {text: `Light Curve (${star.clase})`, font: {size: 18, color: fontColor}},
                    paper_bgcolor: bgColor, plot_bgcolor: bgColor,
                    xaxis: {title: 'Phase', gridcolor: gridColor, color: fontColor},
                    yaxis: {title: 'Ks-band', gridcolor: gridColor, color: fontColor, autorange: 'reversed'},
                    margin: {l: 60, r: 20, t: 50, b: 50},
                    showlegend: false
                };
                return {layoutEntropy, layoutLC};
            }
            
            function drawPlots() {
                const star = starData[currentStarIdx];
                const p_actual = star.grilla_p[currentPIdx];
                const ent_actual = star.entropias[currentPIdx];
                const mjd = star.mjd;
                const mag = star.mag;
                const true_p = star.periodo_real;
                
                pValDisplay.innerText = p_actual.toFixed(5) + " d";
                const layouts = getLayouts(star, p_actual);
                
                // Trazos del periodograma
                const traceEntropy = {
                    x: star.grilla_p, y: star.entropias,
                    type: 'scatter', mode: 'lines',
                    line: {color: isDark ? '#e0e0e0' : 'black'}, name: 'Entropy'
                };
                const tracePoint = {
                    x: [p_actual], y: [ent_actual],
                    type: 'scatter', mode: 'markers',
                    marker: {color: '#ff3333', size: 14}, name: `P = ${p_actual.toFixed(5)}`
                };
                const traceTrueP = {
                    x: [true_p, true_p],
                    y: [Math.min(...star.entropias), Math.max(...star.entropias)],
                    type: 'scatter', mode: 'lines',
                    line: {color: isDark ? '#00b4d8' : 'blue', dash: 'dash', width: 2},
                    name: `True Period = ${true_p.toFixed(5)}`
                };
                
                // Trazos de la Curva de Luz (fases 0-1 y 1-2)
                const phase = calcPhase(mjd, mjd[0], p_actual);
                const phase2 = phase.map(v => v + 1.0);
                const colorLC = isDark ? 'white' : 'black';
                
                const traceLC1 = {
                    x: phase, y: mag, type: 'scatter', mode: 'markers',
                    marker: {color: colorLC, size: 4, opacity: 0.6}
                };
                const traceLC2 = {
                    x: phase2, y: mag, type: 'scatter', mode: 'markers',
                    marker: {color: colorLC, size: 4, opacity: 0.6}
                };
                
                Plotly.react('plotEntropy', [traceEntropy, traceTrueP, tracePoint], layouts.layoutEntropy);
                Plotly.react('plotLC', [traceLC1, traceLC2], layouts.layoutLC);
            }
            
            // Eventos
            selectStar.addEventListener('change', (e) => {
                currentStarIdx = e.target.value;
                slider.max = starData[currentStarIdx].grilla_p.length - 1;
                slider.value = 0; currentPIdx = 0; drawPlots();
            });
            
            slider.addEventListener('input', (e) => {
                currentPIdx = parseInt(e.target.value); drawPlots();
            });
            
            btnTrueP.addEventListener('click', () => {
                const star = starData[currentStarIdx];
                const true_p = star.periodo_real;
                let closestIdx = 0, minDiff = Infinity;
                for(let i=0; i<star.grilla_p.length; i++){
                    let diff = Math.abs(star.grilla_p[i] - true_p);
                    if(diff < minDiff){ minDiff = diff; closestIdx = i; }
                }
                slider.value = closestIdx; currentPIdx = closestIdx; drawPlots();
            });
            
            btnTheme.addEventListener('click', () => {
                isDark = !isDark;
                document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                btnTheme.innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
                drawPlots();
            });
            
            btnPlay.addEventListener('click', () => {
                if(isPlaying){
                    clearInterval(playInterval);
                    btnPlay.innerText = '▶ Play';
                    btnPlay.className = 'info';
                } else {
                    btnPlay.innerText = '⏸ Pause';
                    btnPlay.className = 'success';
                    playInterval = setInterval(() => {
                        currentPIdx += 5; // Salto de la animación
                        if(currentPIdx >= starData[currentStarIdx].grilla_p.length){
                            currentPIdx = 0;
                            if(isPlaying) btnPlay.click(); // Pausa automática al terminar
                        } else {
                            slider.value = currentPIdx; drawPlots();
                        }
                    }, 100);
                }
                isPlaying = !isPlaying;
            });
            
            // Inicializar
            slider.max = starData[0].grilla_p.length - 1;
            drawPlots();
